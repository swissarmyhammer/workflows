name: Swift test
description: >
  Runs `swift test` with the given test-target selectors, and fails the step
  when the selectors matched no test at all.

  Use this action directly from a repository that writes its own CI steps.
  The `swift-ci.yaml` reusable workflow in this repository calls the same
  action, so both routes behave identically.

inputs:
  filter:
    description: >
      Test-target selectors to pass as `--filter`, separated by spaces or by
      newlines. Each selector is a regular expression that `swift test`
      compares against `<test-target>.<test-case>/<test>`, so the name of a
      test target, or a prefix that the test targets share, selects those
      targets. Leave empty to select every test.
    required: false
    default: ""
  skip:
    description: >
      Test-target selectors to pass as `--skip`, separated by spaces or by
      newlines. Same form as `filter`. Use this to hold the slow targets out
      of a fast job. Leave empty to skip nothing.
    required: false
    default: ""
  no-parallel:
    description: >
      Set to `true` to pass `--no-parallel`. Necessary for a test target that
      lets only one test hold a resource at a time: Swift Testing starts the
      time limit of a test before the test takes such a turnstile, so a
      parallel run spends the limit on queue time and a queued suite fails in
      the same way as a hang.
    required: false
    default: "false"
  package-path:
    description: >
      Path to the package to test, passed to `swift test` as
      `--package-path`. Use this for an integration suite that lives in its
      own nested package. Leave empty to test the package in the working
      directory.
    required: false
    default: ""

  heartbeat-seconds:
    description: >
      Seconds between the heartbeat lines that the step prints while
      `swift test` runs. A heartbeat line shows the age of the run and the
      newest test process, so a hang shows which child runs and for how long.
      Set `0` to print no heartbeat.
    required: false
    default: "60"

runs:
  using: composite
  steps:
    - name: Run the selected tests
      shell: bash
      env:
        SWIFT_TEST_FILTER: ${{ inputs.filter }}
        SWIFT_TEST_SKIP: ${{ inputs.skip }}
        SWIFT_TEST_NO_PARALLEL: ${{ inputs.no-parallel }}
        SWIFT_TEST_PACKAGE_PATH: ${{ inputs.package-path }}
        SWIFT_TEST_HEARTBEAT_SECONDS: ${{ inputs.heartbeat-seconds }}
      run: |
        set -euo pipefail

        # Build the option list. `set -f` stops the shell from expanding a
        # selector such as `*Tests` against the files in the directory, and
        # lets the loop split the input on spaces, tabs and newlines.
        set -f
        args=()
        if [ -n "${SWIFT_TEST_PACKAGE_PATH:-}" ]; then
          args+=(--package-path "$SWIFT_TEST_PACKAGE_PATH")
        fi
        for pattern in ${SWIFT_TEST_FILTER:-}; do args+=(--filter "$pattern"); done
        for pattern in ${SWIFT_TEST_SKIP:-}; do args+=(--skip "$pattern"); done
        set +f
        if [ "${SWIFT_TEST_NO_PARALLEL:-false}" = "true" ]; then args+=(--no-parallel); fi

        # `${args[@]+...}` keeps bash 3.2, which is the bash on a macOS
        # runner, from calling an empty array unbound under `set -u`.
        set -- ${args[@]+"${args[@]}"}
        echo "::group::swift test $*"

        # Print a line every interval while the tests run, with the age of the
        # run and the newest test process, so a hang shows which child runs and
        # for how long. The line goes to the same log as the test output.
        heartbeat() {
          local interval="$1" started now pid
          started="$(date +%s)"
          while sleep "$interval"; do
            now="$(date +%s)"
            pid="$(pgrep -n -U "$(id -u)" -f 'swiftpm-testing-helper|xctest' || true)"
            if [ -n "$pid" ]; then
              echo "heartbeat $(date +%H:%M:%S): swift test runs for $((now - started)) s; newest test process: $(ps -o pid=,etime=,command= -p "$pid" | cut -c1-200 || true)"
            else
              echo "heartbeat $(date +%H:%M:%S): swift test runs for $((now - started)) s; no test helper process runs now"
            fi
          done
        }

        log="$(mktemp)"
        heartbeat_pid=""
        # Stop the heartbeat with its `sleep` child, so no process keeps the
        # step log open after the step ends.
        stop_heartbeat() {
          if [ -n "$heartbeat_pid" ]; then
            pkill -P "$heartbeat_pid" 2>/dev/null || true
            kill "$heartbeat_pid" 2>/dev/null || true
          fi
        }
        trap 'stop_heartbeat; rm -f "$log"' EXIT
        interval="${SWIFT_TEST_HEARTBEAT_SECONDS:-60}"
        if [ "$interval" -gt 0 ]; then
          heartbeat "$interval" 2>/dev/null &
          heartbeat_pid=$!
        fi

        # `script` gives `swift test` a terminal, so it writes each line at
        # once and not in blocks, and `script` puts standard error in the same
        # stream. `script` ends with the status of the command, and `pipefail`
        # above carries that status through `tee`. Standard input is
        # `/dev/null`, because `script` stops with an error when standard
        # input is a socket.
        script -q /dev/null swift test "$@" </dev/null | tee "$log"
        stop_heartbeat
        echo "::endgroup::"

        # `swift test` answers 0 when the selectors match no test at all: it
        # prints this warning on standard error and exits clean. A job that
        # measured nothing must fail, so the warning becomes a failure here.
        if grep -q 'No matching test cases were run' "$log"; then
          echo "::error::swift test $* matched no test case: this run measured nothing"
          exit 1
        fi
