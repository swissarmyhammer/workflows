name: Swift CI

on:
  workflow_call:
    inputs:
      developer-dir:
        description: >
          Path to an Xcode.app/Contents/Developer to export as DEVELOPER_DIR
          before building (e.g. for projects that need a beta Xcode with a
          newer Metal toolchain). Leave unset to use the runner's default.
        required: false
        type: string
        default: ""
      test-filter:
        description: >
          Test-target selectors to pass to `swift test` as `--filter` in the
          unit test job, separated by spaces or by newlines. Each selector is
          a regular expression that `swift test` compares against
          `<test-target>.<test-case>/<test>`, so the name of a test target,
          or a prefix that several test targets share, selects those targets.
          A run whose selectors match no test at all FAILS the job, because
          `swift test` reports such a run as a clean exit 0 and a job that
          measured nothing must not report green. Leave empty to run
          `swift test` with no selectors, exactly as before.
        required: false
        type: string
        default: ""
      test-skip:
        description: >
          Test-target selectors to pass to `swift test` as `--skip` in the
          unit test job, in the same form as test-filter. Use this when the
          slow, real-resource tests of the package live in an ordinary test
          target that the unit job must hold out. Leave empty to skip
          nothing.
        required: false
        type: string
        default: ""
      test-no-parallel:
        description: >
          Pass `--no-parallel` to `swift test` in the unit test job. Set this
          for a test target that lets only one test hold a resource at a
          time: Swift Testing starts the time limit of a test before the test
          takes such a turnstile, so a parallel run spends the limit on queue
          time and a queued suite fails in the same way as a hang.
        required: false
        type: boolean
        default: false
      integration-gate-env:
        description: >
          LEGACY, kept for the repositories that already pass it. Prefer
          integration-filter and integration-skip, which select the gated
          tests by TEST TARGET, or integration-package-path, which runs a
          nested integration package.

          Name of an env var to set to 1 to unlock a gated, opt-in
          integration suite that depends on real external resources (models,
          network, GPU). Leave empty to skip the integration job entirely.
          Runs on every trigger (push, pull_request, workflow_dispatch) once
          set, same as the unit test job. Cannot be combined with
          integration-filter, integration-skip or integration-package-path;
          the job stops if both are given.
        required: false
        type: string
        default: ""
      integration-xctest-glob:
        description: >
          find(1) -path glob, relative to .build, locating the integration
          suite's .xctest bundle (e.g. '*IntegrationTests.xctest'). Required
          when integration-gate-env is set.

          LIMITATION: exactly ONE bundle runs. The glob is read with
          `head -n 1`, so when it matches more than one .xctest bundle, only
          the first one runs and the rest never execute and never report.
          A package whose gated tests live in more than one bundle therefore
          has bundles that CI has never run. integration-filter does not have
          this limitation, because `swift test` runs every bundle its
          selectors match.
        required: false
        type: string
        default: ""
      integration-metallib-glob:
        description: >
          Optional find(1) -path glob locating an mlx-swift default.metallib
          to copy next to the .xctest bundles before the tests run (e.g.
          '*Cmlx*/default.metallib'). Works around `swift test`/xctest
          failing to load it under SwiftPM. The glob is searched under
          `<integration-package-path>/.build` when integration-package-path
          is set, and under the root .build on the legacy
          integration-gate-env path. Leave empty if the integration suite
          does not depend on mlx-swift.
        required: false
        type: string
        default: ""
      integration-filter:
        description: >
          Test-target selectors to pass to `swift test` as `--filter` in the
          integration job, in the same form as test-filter. This is the way
          to select the gated tests BY TEST TARGET, and it replaces
          integration-gate-env, integration-xctest-glob and
          integration-metallib-glob.

          Setting this, or integration-skip, runs the integration job. A run
          whose selectors match no test at all FAILS the job. Unlike
          integration-xctest-glob, every test target the selectors match
          runs, not only the first one.
        required: false
        type: string
        default: ""
      integration-skip:
        description: >
          Test-target selectors to pass to `swift test` as `--skip` in the
          integration job, in the same form as test-filter. Use this to hold
          out a tier that is too slow even for the integration job. Setting
          this, or integration-filter, runs the integration job.
        required: false
        type: string
        default: ""
      integration-no-parallel:
        description: >
          Pass `--no-parallel` to `swift test` in the integration job. Set
          this for a test target that lets only one test hold a real
          resource, such as a GPU model, at a time. See test-no-parallel for
          why a parallel run of such a target fails in the same way as a
          hang.
        required: false
        type: boolean
        default: false
      integration-package-path:
        description: >
          Path, relative to the repository root, to a nested package that
          holds the integration suite (e.g. 'IntegrationTests') and depends
          on the root package by a path. Setting this runs the integration
          job: the job builds the package and runs
          `swift test --package-path` on it, and integration-filter,
          integration-skip and integration-no-parallel apply to that run.
          The UNIT job also builds this package on every run, because the
          root build does not compile a nested package, and a broken
          integration test must not stay unseen between runs. Cannot be
          combined with integration-gate-env.
        required: false
        type: string
        default: ""
      integration-root-products:
        description: >
          Whitespace-separated list of product names of the ROOT package to
          build at the repository root before the integration tests run (e.g.
          'mcp-test-server'). Set this for a suite that starts an executable of
          the root package as a subprocess and reads it at
          `.build/debug/<name>`.

          The integration job removes the root .build at its start, and a
          nested package build writes its products under
          <integration-package-path>/.build. Thus no other step of that job
          puts a root product at .build/debug, and a suite that expects one
          fails. Leave empty to build no root product.
        required: false
        type: string
        default: ""
      integration-artifacts-path:
        description: >
          Path, relative to the repository root, to the forensic output of the
          integration suite, such as the transcripts that the tests write (e.g.
          'IntegrationTests/.build/recordings'). The integration job uploads
          this path as an artifact named integration-artifacts after the tests
          run, and it uploads the path also when the test step fails, stops on
          a time limit, or is cancelled. A run that hangs with no output thus
          keeps the files that show what happened. A run that writes no file
          uploads nothing and stays green. Leave empty to upload nothing.
        required: false
        type: string
        default: ""
      example-targets:
        description: >
          Whitespace-separated list of additional executable target names to
          build individually via `swift build --target <name>`, on top of the
          whole-package `swift build --build-tests` above (e.g. for a set of
          Examples/ targets whose per-target compilation is itself an
          acceptance criterion). Leave empty to skip.
        required: false
        type: string
        default: ""
      docc-target:
        description: >
          Name of a library target to build a DocC catalog for via
          swift-docc-plugin's `generate-documentation --warnings-as-errors`
          (promotes DocC's own diagnostics — unresolved ``symbol``
          cross-references, malformed directives — to build failures). The
          calling package must declare a dependency on
          `swiftlang/swift-docc-plugin` itself; this workflow only invokes the
          plugin. Leave empty to skip DocC entirely.
        required: false
        type: string
        default: ""
      docc-coverage-script:
        description: >
          Path, relative to the repository root, to a script that enforces
          zero missing-documentation warnings against the report produced by
          `generate-documentation --experimental-documentation-coverage`
          (DocC has no built-in "undocumented symbol" warning class, so
          --warnings-as-errors above has nothing to promote for that case —
          this is the actual enforcement mechanism). Invoked as
          `<script> <coverage-report-path>` and expected to exit non-zero on
          a coverage gap. Only meaningful alongside docc-target; leave empty
          to build DocC without coverage enforcement.
        required: false
        type: string
        default: ""

jobs:
  test:
    name: Build & test
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4

      - name: Configure DEVELOPER_DIR
        if: inputs.developer-dir != ''
        run: echo "DEVELOPER_DIR=${{ inputs.developer-dir }}" >> "$GITHUB_ENV"

      - name: Toolchain versions
        run: |
          sw_vers
          swift --version

      - name: Clean build directory
        run: rm -rf .build

      - name: Build (incl. tests)
        run: swift build --build-tests

      # Two steps, and exactly one of them runs. A caller that passes none of
      # the test-* selectors gets the plain `swift test` it has always got.
      - name: Run tests
        if: inputs.test-filter == '' && inputs.test-skip == '' && !inputs.test-no-parallel
        run: swift test

      - name: Run the selected tests
        if: inputs.test-filter != '' || inputs.test-skip != '' || inputs.test-no-parallel
        uses: swissarmyhammer/workflows/.github/actions/swift-test@main
        with:
          filter: ${{ inputs.test-filter }}
          skip: ${{ inputs.test-skip }}
          no-parallel: ${{ inputs.test-no-parallel }}

      # The root build does not compile a nested integration package, so a
      # broken integration test would stay unseen between runs. Build the
      # package on every run.
      - name: Build the nested integration package
        if: inputs.integration-package-path != ''
        run: |
          rm -rf '${{ inputs.integration-package-path }}/.build'
          swift build --package-path '${{ inputs.integration-package-path }}' --build-tests

      - name: Build additional example targets
        if: inputs.example-targets != ''
        run: |
          set -euo pipefail
          for target in ${{ inputs.example-targets }}; do
            echo "::group::swift build --target $target"
            swift build --target "$target"
            echo "::endgroup::"
          done

      - name: DocC build
        if: inputs.docc-target != ''
        run: swift package generate-documentation --target ${{ inputs.docc-target }} --warnings-as-errors

      - name: DocC documentation coverage
        if: inputs.docc-target != '' && inputs.docc-coverage-script != ''
        run: |
          set -euo pipefail
          swift package generate-documentation --target ${{ inputs.docc-target }} \
            --experimental-documentation-coverage --coverage-summary-level detailed \
            > docc-coverage.txt
          python3 ${{ inputs.docc-coverage-script }} docc-coverage.txt

  integration:
    name: Integration (opt-in, real dependencies)
    # A fast unit failure must stop the run before this job takes the runner.
    needs: test
    # The legacy env-var gate, the test-target selectors, or a nested package
    # path runs this job.
    if: >-
      inputs.integration-gate-env != ''
      || inputs.integration-filter != ''
      || inputs.integration-skip != ''
      || inputs.integration-package-path != ''
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4

      # The two paths select different tests, so a caller that gives both
      # gets one of the two silently ignored. Stop instead.
      - name: Reject both integration paths at once
        if: >-
          inputs.integration-gate-env != ''
          && (inputs.integration-filter != ''
              || inputs.integration-skip != ''
              || inputs.integration-package-path != '')
        run: |
          echo "::error::integration-gate-env cannot be combined with integration-filter, integration-skip or integration-package-path. Use the selectors or the package path alone."
          exit 1

      - name: Configure DEVELOPER_DIR
        if: inputs.developer-dir != ''
        run: echo "DEVELOPER_DIR=${{ inputs.developer-dir }}" >> "$GITHUB_ENV"

      - name: Clean build directory
        run: rm -rf .build

      - name: Build tests
        if: inputs.integration-package-path == ''
        run: swift build --build-tests

      # Building the nested package also compiles the root package, because
      # the nested package depends on it by a path.
      - name: Build the nested integration package
        if: inputs.integration-package-path != ''
        run: |
          rm -rf '${{ inputs.integration-package-path }}/.build'
          swift build --package-path '${{ inputs.integration-package-path }}' --build-tests

      # The clean step above removed the root .build, and the nested package
      # build writes its products under the nested .build. Thus a product of
      # the root package stands nowhere in this job. Build each product that
      # the integration suite starts as a subprocess.
      - name: Build the root products the integration suite starts
        if: inputs.integration-root-products != ''
        run: |
          set -euo pipefail
          for product in ${{ inputs.integration-root-products }}; do
            echo "::group::swift build --product $product"
            swift build --product "$product"
            echo "::endgroup::"
          done

      # mlx-swift's default.metallib does not load from the SwiftPM build
      # layout on its own. Copy it next to each .xctest bundle of the nested
      # package before the tests run.
      - name: Copy the metallib into the nested package build
        if: inputs.integration-package-path != '' && inputs.integration-metallib-glob != ''
        run: |
          set -euo pipefail
          BUILD_DIR='${{ inputs.integration-package-path }}/.build'
          METALLIB="$(find "$BUILD_DIR" -path '${{ inputs.integration-metallib-glob }}' | head -n 1)"
          echo "metallib: ${METALLIB:?not found}"
          # mlx probes `<binary-dir>/mlx.metallib` first (measured in
          # FoundationModelsMultitool), and older setups read
          # `default.metallib`. Copy the file under both names.
          find "$BUILD_DIR" -name '*.xctest' -type d | while read -r XCTEST; do
            echo "copy beside: $XCTEST"
            if [ -d "$XCTEST/Contents/MacOS" ]; then
              DEST="$XCTEST/Contents/MacOS"
            else
              DEST="$(dirname "$XCTEST")"
            fi
            cp "$METALLIB" "$DEST/default.metallib"
            cp "$METALLIB" "$DEST/mlx.metallib"
          done

      - name: Run the selected integration tests
        if: inputs.integration-gate-env == ''
        uses: swissarmyhammer/workflows/.github/actions/swift-test@main
        with:
          package-path: ${{ inputs.integration-package-path }}
          filter: ${{ inputs.integration-filter }}
          skip: ${{ inputs.integration-skip }}
          no-parallel: ${{ inputs.integration-no-parallel }}

      - name: Run gated integration suite
        if: inputs.integration-gate-env != ''
        run: |
          set -euo pipefail
          XCTEST="$(find .build -path '${{ inputs.integration-xctest-glob }}' -type d | head -n 1)"
          echo "xctest: ${XCTEST:?not found}"

          METALLIB_GLOB='${{ inputs.integration-metallib-glob }}'
          if [ -n "$METALLIB_GLOB" ]; then
            METALLIB="$(find .build -path "$METALLIB_GLOB" | head -n 1)"
            echo "metallib: ${METALLIB:?not found}"
            cp "$METALLIB" "$XCTEST/Contents/MacOS/" 2>/dev/null \
              || cp "$METALLIB" "$(dirname "$XCTEST")/"
          fi

          ${{ inputs.integration-gate-env }}=1 xcrun xctest "$XCTEST"

      # The forensic files of a run are most necessary when the run went wrong,
      # so `always()` keeps this step after a test step that failed, stopped on
      # a time limit, or was cancelled. A run that hangs for 30 minutes with no
      # model output leaves a transcript that a person can read. The step runs
      # after both test steps above, because exactly one of the two ran.
      - name: Upload the integration artifacts
        if: always() && inputs.integration-artifacts-path != ''
        uses: actions/upload-artifact@v4
        with:
          name: integration-artifacts
          path: ${{ inputs.integration-artifacts-path }}
          # A run that wrote no file must not fail the job for that.
          if-no-files-found: ignore
